  L.gate = (z, x, hw, op, val, o = {}) => add(Object.assign({ t: 'gate', x, x0: x, z, hw, op, val }, o));
  L.pair = (z, a, b, mv) => { const o = mv ? { row: z, amp: 1.6, w: mv.w, ph: mv.ph || 0 } : { row: z }, x = mv ? 1.6 : 2.5, hw = mv ? 1.5 : 2.3; L.gate(z, -x, hw, a[0], a[1], o); L.gate(z, x, hw, b[0], b[1], o); };
  L.tri = (z, a, b, c, mv) => { const o = mv ? { row: z, amp: 1.5, w: mv.w, ph: mv.ph || 0 } : { row: z }, x = mv ? 2.2 : 3.3, hw = mv ? 1.0 : 1.5; L.gate(z, -x, hw, a[0], a[1], o); L.gate(z, 0, hw, b[0], b[1], o); L.gate(z, x, hw, c[0], c[1], o); };

}
